<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes — Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">N</div>

                <div>
                    <h1>Notes</h1>
                    <p>Your thoughts, organized.</p>
                </div>
            </div>

            <div class="auth-heading">
                <h2>Create your account</h2>

                <p>
                    Start organizing your thoughts in one place.
                </p>
            </div>


            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}


            <form method="POST">

                <div class="input-group">

                    <label for="name">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn">

                    Create account

                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="/">
                    Sign in
                </a>

            </div>

        </section>

    </main>

</body>
</html>
